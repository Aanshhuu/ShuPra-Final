<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupraProtects</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="auth-wall" class="container auth-wall">
    <header class="mini-header">
      <div class="brand-pill">
        <span class="logo-emoji">🛡️</span>
        <div>
          <strong>SupraProtects</strong>
          <small>Inbox radar</small>
        </div>
      </div>
    </header>
    <section class="section slim">
      <form id="auth-form" class="auth-form">
        <div class="input-group">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" autocomplete="email" placeholder="you@securemail.com" required>
        </div>
        <div class="input-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <div class="auth-actions">
          <button id="auth-login" class="btn btn-primary" type="submit">Unlock radar</button>
        </div>
        <div id="auth-status" class="status-message"></div>
      </form>
    </section>
  </div>

  <div id="app-container" class="container hidden">
    <header class="mini-header">
      <div class="brand-pill">
        <span class="logo-emoji">🛡️</span>
        <div>
          <strong>SupraProtects</strong>
          <small>Inbox radar</small>
        </div>
      </div>
    </header>
    <div class="auth-banner">
      <div>
        <small>Logged in as</small>
        <strong id="auth-user-email">...</strong>
      </div>
      <button id="logout-btn" class="btn btn-ghost" type="button">Logout</button>
    </div>

    <section class="section slim">
      <div class="toggle-group">
        <label class="toggle-label">
          <input type="checkbox" id="firebase-toggle">
          <span>Sync my scans to the realtime dashboard</span>
        </label>
      </div>
      <div class="input-group hidden" id="email-group">
        <label for="user-email">Dashboard email</label>
        <input type="email" id="user-email" placeholder="you@securemail.com">
      </div>
      <div id="firebase-status" class="status-message"></div>
    </section>

    <section class="section slim">
      <button id="scan-btn" class="btn btn-scan">
        <span class="btn-icon">✨</span>
        Scan Current Email
      </button>
      <div id="scan-status" class="status-message"></div>
    </section>

    <section id="results-section" class="section slim" style="display: none;">
      <div class="section-heading">
        <div>
          <h2>Analysis results</h2>
          <p>Indicators appear after each scan.</p>
        </div>
      </div>
      <div id="result-card" class="result-card">
        <div class="result-header">
          <span id="result-icon" class="result-icon"></span>
          <span id="result-title" class="result-title"></span>
        </div>
        <div class="result-body">
          <div class="confidence-bar">
            <label>Confidence Level</label>
            <div class="progress-bar">
              <div id="confidence-fill" class="progress-fill"></div>
            </div>
            <span id="confidence-text" class="confidence-text"></span>
          </div>
          <div class="recommendation">
            <strong>Recommendation</strong>
            <p id="recommendation-text"></p>
          </div>
          <div id="link-health-section" class="link-health" style="display: none;">
            <strong>Link Reachability</strong>
            <p class="link-health-summary" id="link-health-summary"></p>
            <ul id="link-health-list"></ul>
          </div>
          <div id="indicators-section" class="indicators">
            <strong>Suspicious Indicators</strong>
            <ul id="indicators-list"></ul>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
